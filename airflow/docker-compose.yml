# local airflow, deliberately not cloud composer.
#
# composer's smallest environment runs about three hundred dollars a month
# whether or not a dag fires, because it keeps a gke cluster warm. this project
# runs one dag a day over a few hundred rows. the dag code is identical, so
# moving to composer later is a deploy rather than a rewrite, and the readme
# says "airflow, locally" rather than implying a managed deployment.
#
#   docker compose up
#   open http://localhost:8080   (admin / admin)

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.12
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:-pulseops-muste}
    # the copilot and loaders read application default credentials, which are
    # mounted read-only from the host rather than baked into the image
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcloud/application_default_credentials.json
    PYTHONPATH: /opt/airflow/pulseops/src
    # installed at container start. a pip install inside airflow-init would
    # only live in that container and the scheduler would still be missing it.
    _PIP_ADDITIONAL_REQUIREMENTS: google-cloud-bigquery>=3.25 dbt-bigquery>=1.9
  volumes:
    - ./dags:/opt/airflow/dags
    - ..:/opt/airflow/pulseops:ro
    - ~/.config/gcloud:/opt/airflow/gcloud:ro
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    volumes:
      - postgres-db:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname pulse --lastname ops --role Admin --email admin@example.com || true
    restart: on-failure

  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 20s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
